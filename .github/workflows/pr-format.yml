name: Submission format
# Checks the title and description of task and fix PRs against the SPU templates and tells the author what to fix.
# pull_request_target runs this file from the default branch; the PR's own files are never checked out or executed.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: spu-pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check title and description
        run: node scripts/pr-format.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
