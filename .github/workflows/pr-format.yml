name: Submission format
# Checks the title and description of task and fix PRs against the SPU templates and keeps one summary comment
# with every check, the AI review status and the next steps. A status event from the AI review refreshes it.
# pull_request_target and status run this file from the default branch; the PR's own files are never checked out or executed.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  status:
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: spu-pr-format-${{ github.event.pull_request.number || github.event.sha }}
  cancel-in-progress: true
jobs:
  format:
    if: github.event_name != 'status' || github.event.context == 'spu/clarity-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check title and description
        run: node scripts/pr-format.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
